name: 🔄 Auto Sync Upstream Fork

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 0:00) 自动同步一次
    - cron: '0 0 * * *'
  # 允许你在 GitHub 网页上随时手动点击“立即同步”
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          # 0. 配置 git 提交者身份（创建合并提交必需，否则报 "Committer identity unknown"）
          git config user.name "aifeifei798"
          git config user.email "aifeifei7@outlook.com"

          # 1. 配置原作者上游仓库地址
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream

          # 2. 识别当前默认分支（通常是 dev 或 main）
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          echo "Current default branch is: $DEFAULT_BRANCH"

          # 3. 切换并合并上游更新
          git checkout $DEFAULT_BRANCH
          git merge upstream/$DEFAULT_BRANCH --ff-only || git merge upstream/$DEFAULT_BRANCH -m "chore: sync with upstream"

          # 4. 推送到你的个人 Fork 仓库
          git push origin $DEFAULT_BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
