name: Sync Upstream

# 每天 08:00 UTC 把上游 anomalyco/opencode 的 dev 分支合并进本 fork 的 dev。
# fork 上只有这一个文件是自定义的，正常不会冲突；真出现冲突时这次运行会报红，
# 需要人工处理（不会破坏历史）。也可以随时在 Actions 页面手动点 Run workflow。

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream dev
        run: |
          # CI runner 没有默认身份，合并提交会因 "empty ident name" 直接失败（exit 128）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git \
            || git remote set-url upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          if ! git merge --no-edit upstream/dev; then
            echo "::error::合并上游 dev 失败（冲突或身份问题），已中止，未推送任何内容"
            git merge --abort || true
            exit 1
          fi
      - name: Push
        run: git push origin dev
