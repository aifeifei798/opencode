name: Sync Upstream

# 每天 08:00 UTC 把上游 anomalyco/opencode 的 dev 分支合并进本 fork 的 dev。
# fork 上只有这一个文件是自定义的，正常不会冲突；真出现冲突时这次运行会报红，
# 需要人工处理（不会破坏历史）。也可以随时在 Actions 页面手动点 Run workflow。
#
# 关于 SYNC_TOKEN：GITHUB_TOKEN 永远拿不到 workflows 权限（`permissions:` 里没有这个键），
# 而上游经常改 .github/workflows/*.yml，push 会被拒：
#   refusing to allow a GitHub App to create or update workflow ... without `workflows` permission
# 所以这里用 secrets.SYNC_TOKEN（classic PAT 需勾 repo + workflow；
# fine-grained 需 Contents: Read and write + Workflows: Read and write）。

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::缺少 secrets.SYNC_TOKEN，无法推送 workflow 文件改动。请按文件头注释配置 PAT。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream dev
        run: |
          # runner 没有默认 git 身份，合并提交会因 "empty ident name" 直接失败（exit 128）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git \
            || git remote set-url upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          if ! git merge --no-edit upstream/dev; then
            echo "::error::合并上游 dev 失败（冲突或身份问题），已中止，未推送任何内容"
            git merge --abort || true
            exit 1
          fi

      - name: Push
        run: git push origin dev
